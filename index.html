<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats Engine 1.0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b11;color:#eef2f7;font:15px Arial,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px}.sub{color:#8993a3;margin-top:-10px}.badge{display:inline-flex;border:1px solid #263142;border-radius:999px;padding:8px 13px;margin:16px 0}.dot{width:9px;height:9px;border-radius:50%;background:#64748b;margin:4px 8px 0 0}.card{background:#111722;border:1px solid #232d3d;border-radius:18px;padding:20px;margin:18px 0}label{display:block;color:#9aa5b5;font-size:12px;text-transform:uppercase;margin-bottom:9px}input{width:100%;background:#080c12;border:1px solid #293446;color:white;border-radius:13px;padding:17px;font-size:18px}button{border:0;border-radius:13px;padding:15px 22px;margin:12px 6px 0 0;font-weight:bold;font-size:15px}#start{background:white;color:#111}#stop{background:#263143;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#080c12;border:1px solid #232d3d;border-radius:13px;padding:14px}.stat small{display:block;color:#8792a3;text-transform:uppercase}.stat b{display:block;font-size:25px;margin-top:7px}.box{background:#05080d;border-radius:13px;padding:14px;white-space:pre-wrap;overflow:auto;max-height:520px;font-family:monospace;font-size:12px;color:#cbd5e1}.ok{background:#22c55e}.bad{background:#fb7185}.warn{background:#f59e0b}
</style>
</head>
<body><main>
<h1>Stats Engine <small>1.0.1</small></h1>
<p class="sub">MatchStats oficial · captura real · atualização de 1 em 1 segundo</p>
<div class="badge"><i id="dot" class="dot"></i><span id="status">PARADO</span></div>
<section class="card"><label>Match ID</label><input id="matchId" value="1" inputmode="numeric"><button id="start">▶ INICIAR</button><button id="stop">■ PARAR</button><p class="sub">O Engine consulta o MatchStats no servidor e não exige recarregar esta página.</p></section>
<section class="card grid">
<div class="stat"><small>Consultas</small><b id="consultas">0</b></div><div class="stat"><small>Alterações</small><b id="changes">0</b></div>
<div class="stat"><small>Fase</small><b id="phase">idle</b></div><div class="stat"><small>Intervalo</small><b>1s</b></div>
</section>
<section class="card"><label>Diagnóstico</label><div id="diag" class="box">Aguardando.</div></section>
<section class="card"><label>Dados reais capturados</label><div id="data" class="box">Nenhuma partida monitorada.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt){let r=await fetch(url,opt);return r.json()}
$("start").onclick=async()=>{await api("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({matchId:$("matchId").value})});update()};
$("stop").onclick=async()=>{await api("/api/stop",{method:"POST"});update()};
async function update(){try{let s=await api("/api/status");$("status").textContent=s.status;$("dot").className="dot "+(s.status==="CONNECTED"?"ok":s.status==="ERROR"?"bad":"warn");$("consultas").textContent=s.consultations;$("changes").textContent=s.changes;$("phase").textContent=s.phase; $("diag").textContent=JSON.stringify({status:s.status,phase:s.phase,matchId:s.matchId,currentUrl:s.currentUrl,title:s.title,lastUpdate:s.lastUpdate,error:s.error},null,2);$("data").textContent=s.data?JSON.stringify(s.data,null,2):"Nenhuma partida monitorada."}catch(e){}}
setInterval(update,1000);update();
</script></body></html>
