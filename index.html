<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats Engine — Teste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f7fb;font:14px system-ui,Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center}
h1{margin:0;font-size:25px}.muted{margin-top:5px;color:#8e99aa;font-size:12px}
.status{border:1px solid #263043;border-radius:999px;padding:8px 12px;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#667085;margin-right:7px}
.dot.on{background:#32d583;box-shadow:0 0 12px #32d583}
.card{margin-top:15px;background:#10151f;border:1px solid #202a39;border-radius:15px;padding:16px}
label{display:block;color:#98a3b4;font-size:11px;font-weight:800;margin-bottom:7px}
.row{display:grid;grid-template-columns:1fr auto;gap:9px}
input{height:45px;width:100%;background:#0a0e15;color:#fff;border:1px solid #2a3445;border-radius:9px;padding:0 12px;font-size:15px;outline:none}
button{height:45px;border:0;border-radius:9px;padding:0 16px;font-weight:800;cursor:pointer}
.go{background:#fff;color:#080b12}.stop{background:#252d3a;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.metric{background:#0a0e15;border:1px solid #202a39;border-radius:10px;padding:13px}
.metric b{display:block;color:#8e99aa;font-size:10px}.metric strong{display:block;font-size:20px;margin-top:4px}
pre{white-space:pre-wrap;word-break:break-word;background:#070a0f;border-radius:10px;padding:12px;max-height:600px;overflow:auto;color:#b8c2d0;font:12px ui-monospace,monospace}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:14px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Stats Engine</h1>
      <div class="muted">Teste de captura real · MatchStats oficial · atualização de 1 em 1 segundo</div>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">PARADO</span></div>
  </div>

  <div class="card">
    <label>MATCH ID</label>
    <div class="row">
      <input id="matchId" placeholder="Digite um MatchID real">
      <div>
        <button class="go" id="start">▶ INICIAR</button>
        <button class="stop" id="stop">■ PARAR</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="metrics">
      <div class="metric"><b>CONSULTAS</b><strong id="polls">0</strong></div>
      <div class="metric"><b>ALTERAÇÕES</b><strong id="changes">0</strong></div>
      <div class="metric"><b>ÚLTIMA ATUALIZAÇÃO</b><strong id="last">—</strong></div>
      <div class="metric"><b>INTERVALO</b><strong>1s</strong></div>
    </div>
  </div>

  <div class="card">
    <label>DADOS REAIS CAPTURADOS</label>
    <pre id="output">Nenhuma partida monitorada.</pre>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function refresh() {
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    render(await response.json());
  } catch {}
}

function render(state) {
  $("status").textContent = state.status || "PARADO";
  $("dot").classList.toggle(
    "on",
    Boolean(state.running && state.status === "CONECTADO")
  );

  $("polls").textContent = state.polls ?? 0;
  $("changes").textContent = state.changes ?? 0;
  $("last").textContent = state.lastUpdate
    ? new Date(state.lastUpdate).toLocaleTimeString()
    : "—";

  if (state.error) {
    $("output").textContent = "ERRO: " + state.error;
  } else if (state.data) {
    $("output").textContent = JSON.stringify(state.data, null, 2);
  }
}

$("start").onclick = async () => {
  const matchId = $("matchId").value.trim();

  if (!matchId) {
    alert("Digite um MatchID real.");
    return;
  }

  $("status").textContent = "PESQUISANDO";

  try {
    const response = await fetch("/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ matchId })
    });

    const result = await response.json();

    if (result.error) throw new Error(result.error);
    render(result);
  } catch (error) {
    alert(error.message);
  }
};

$("stop").onclick = async () => {
  await fetch("/api/stop", { method: "POST" });
  refresh();
};

setInterval(refresh, 500);
refresh();
</script>
</body>
</html>
