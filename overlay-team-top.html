<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Top</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img id="bg" class="bg"><div class="champ" id="champ"></div><img id="logo" class="dyn logo" style="left:810px;top:350px;width:300px;height:300px"><div id="name" class="dyn name" style="left:620px;top:690px;width:680px;font-size:52px"></div><div id="value" class="dyn value" style="left:720px;top:855px;width:480px;font-size:56px"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,key=new URLSearchParams(location.search).get('key')||'teamKills',root=document.getElementById('root');document.getElementById('bg').src='../../'+(window.OVERLAY_CONFIG.overlays[key]?.background||'team-kills.png');document.getElementById('champ').textContent=(window.OVERLAY_CONFIG.fields.championship||'').toUpperCase();
function render(top){if(!top){E.fadeOut(root);return}const o=top;const data=window.OVERLAY_DATA||{};const logo=data.teamLogos?.[o.teamId]||data.teamLogos?.[o.teamName]||data.defaultLogo;document.getElementById('logo').src=logo;document.getElementById('name').textContent=o.teamName||'TEAM';document.getElementById('value').textContent=o.value||'0';E.fadeIn(root);clearTimeout(window.__hide);window.__hide=setTimeout(()=>E.fadeOut(root),window.OVERLAY_CONFIG.animation.topDurationMs)}
E.api('/api/overlay/'+encodeURIComponent(key)).then(j=>{if(j.enabled)render(j.data?.tops?.[key])});E.stream(m=>{if(m.type==='overlay'&&m.key===key)render(m.data);if(m.type==='overlay-state'&&m.key===key&&!m.enabled)E.fadeOut(root);});setInterval(()=>E.api('/api/overlay/'+encodeURIComponent(key)).then(j=>{if(j.enabled&&j.data)render(j.data.tops?.[key])}).catch(()=>{}),1);
</script></body></html>
