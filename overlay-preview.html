<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{font-family:Arial,Helvetica,sans-serif}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:transparent}.overlay{position:absolute;inset:0;opacity:0;pointer-events:none}.overlay.in{opacity:1;animation:enter .42s cubic-bezier(.2,.9,.2,1) both}.overlay.out{animation:exit .36s ease both}@keyframes enter{from{opacity:0;transform:translateX(90px) scale(.96)}to{opacity:1;transform:none}}@keyframes exit{from{opacity:1;transform:none}to{opacity:0;transform:translateX(90px) scale(.96)}}.bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:contain}.logo{position:absolute;object-fit:contain}.photo{position:absolute;object-fit:contain}.txt{position:absolute;text-align:center;font-weight:900;text-shadow:0 3px 12px rgba(0,0,0,.75)}#rankingRows{position:absolute;inset:0}.ranking-row{position:absolute;display:grid;grid-template-columns:90px 130px 1fr 160px 160px;align-items:center;height:72px;font-size:27px;color:#fff}.ranking-row .rank{text-align:center;font-weight:900}.ranking-row img{width:54px;height:54px;object-fit:contain}.ranking-row .team-name{font-weight:900}.ranking-row .points{text-align:center;font-weight:900}.status{display:flex;gap:8px}.bar{width:16px;height:42px;background:#24df6b;box-shadow:0 0 12px rgba(36,223,107,.3)}.bar.dead{background:#ef3340;opacity:.6}.bar.knock{background:#ffb32c}.champ{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:30px;letter-spacing:.18em;color:#111;background:#ffc400;padding:8px 30px;border:3px solid #111}.top-name{left:560px;top:690px;width:800px;font-size:52px}.top-team{left:600px;top:760px;width:720px;font-size:30px;color:#ddd}.top-value{left:650px;top:845px;width:620px;font-size:54px}.team-logo{left:805px;top:350px;width:310px;height:310px}.player-photo{left:125px;top:365px;width:310px;height:350px}.player-logo{left:805px;top:350px;width:310px;height:310px}.eliminated-logo{left:145px;top:390px;width:280px;height:280px}.eliminated-rank{left:775px;top:805px;width:180px;font-size:48px;color:#fff}.eliminated-name{left:980px;top:805px;width:760px;font-size:58px;color:#111}.empty-note{position:absolute;left:0;right:0;top:520px;text-align:center;color:#777;font-size:24px;display:none}
</style></head><body>
<div id="stage" class="stage">
  <div id="ranking" class="overlay"><img class="bg" src="ranking.png"><div id="rankingRows"></div></div>
  <div id="teamTop" class="overlay"><img id="teamBg" class="bg"><div id="teamChamp" class="champ"></div><img id="teamLogo" class="logo team-logo"><div id="teamName" class="txt top-name"></div><div id="teamValue" class="txt top-value"></div></div>
  <div id="playerTop" class="overlay"><img id="playerBg" class="bg"><div id="playerChamp" class="champ"></div><img id="playerPhoto" class="photo player-photo"><img id="playerLogo" class="logo player-logo"><div id="playerName" class="txt top-name"></div><div id="playerTeam" class="txt top-team"></div><div id="playerValue" class="txt top-value"></div></div>
  <div id="eliminated" class="overlay"><img class="bg" src="team-eliminated.png"><img id="elimLogo" class="logo eliminated-logo"><div id="elimRank" class="txt eliminated-rank"></div><div id="elimName" class="txt eliminated-name"></div></div>
  <div id="empty" class="empty-note">Aguardando uma overlay ativa…</div>
</div>
<script src="overlay-config.js"></script><script src="overlay-data.js"></script>
<script>
const cfg=window.OVERLAY_CONFIG||{},data=window.OVERLAY_DATA||{};const $=s=>document.querySelector(s);const stage=$('#stage');
const transientKeys=new Set(['teamKills','teamDamage','teamHeadshots','teamAssist','teamRevival','playerKills','playerDamage','playerAssist','playerMovingDistance','playerHeadshots','playerKnockDown','playerRescueMembers','playerMaximumKillDistance','teamEliminated']);
let state=null,hideTimer=null;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1920*s)/2)+'px';stage.style.top=((innerHeight-1080*s)/2)+'px'}addEventListener('resize',fit);fit();
function logoFor(top){return data.teamLogos?.[top?.teamId]||data.teamLogos?.[top?.teamName]||data.defaultLogo||'default-logo.svg'}
function photoFor(top){return data.playerPhotos?.[top?.playerId]||data.playerPhotos?.[top?.playerName]||data.defaultPhoto||'default-player.svg'}
function show(el){document.querySelectorAll('.overlay').forEach(x=>{if(x!==el){x.classList.remove('in');x.classList.add('out')}});$('#empty').style.display='none';el.classList.remove('out');void el.offsetWidth;el.classList.add('in')}
function hide(el){el.classList.remove('in');el.classList.add('out');if(!state?.overlays?.ranking?.enabled)$('#empty').style.display='block'}
function renderRanking(d){const m=d?.teamData||[];const box=$('#rankingRows');box.innerHTML='';if(!m.length){hide($('#ranking'));return}const h=m[0]||[];m.slice(1).forEach((r,i)=>{const el=document.createElement('div');el.className='ranking-row';el.style.left='650px';el.style.top=(182+i*72)+'px';el.style.width='1020px';const obj=Object.fromEntries(h.map((x,j)=>[x,r[j]]));const rank=obj['Match Rank']||String(i+1),name=obj['Team Name']||'TEAM',kills=obj['Kill']||'0';el.innerHTML=`<div class="rank">${esc(rank)}</div><img src="${esc(logoFor(obj))}"><div class="team-name">${esc(name)}</div><div class="points">${esc(kills)}</div><div class="status"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div>`;box.appendChild(el)});show($('#ranking'))}
function renderTeam(top,key){if(!top)return;$('#teamBg').src=cfg.overlays?.[key]?.background||'team-kills.png';$('#teamChamp').textContent=(cfg.fields?.championship||'').toUpperCase();$('#teamLogo').src=logoFor(top);$('#teamName').textContent=top.teamName||'TEAM';$('#teamValue').textContent=top.value??'0';show($('#teamTop'));clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(state?.overlays?.ranking?.enabled)renderRanking(state.data||state);else hide($('#teamTop'))},cfg.animation?.topDurationMs||6500)}
function renderPlayer(top,key){if(!top)return;$('#playerBg').src=cfg.overlays?.[key]?.background||'player-kills.png';$('#playerChamp').textContent=(cfg.fields?.championship||'').toUpperCase();$('#playerPhoto').src=photoFor(top);$('#playerLogo').src=logoFor(top);$('#playerName').textContent=top.playerName||'PLAYER';$('#playerTeam').textContent=top.teamName||'';$('#playerValue').textContent=top.value??'0';show($('#playerTop'));clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(state?.overlays?.ranking?.enabled)renderRanking(state.data||state);else hide($('#playerTop'))},cfg.animation?.topDurationMs||6500)}
function renderEliminated(top){if(!top)return;$('#elimLogo').src=logoFor(top);$('#elimRank').textContent='#'+(top.rank||'');$('#elimName').textContent=top.teamName||'TEAM';show($('#eliminated'));clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(state?.overlays?.ranking?.enabled)renderRanking(state.data||state);else hide($('#eliminated'))},cfg.animation?.topDurationMs||6500)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderState(s,d){state=s||state;if(!state)return;state.data=d||state.data;if(state.overlays?.ranking?.enabled){renderRanking(state.data)}else if(!document.querySelector('.overlay.in'))$('#empty').style.display='block'}
async function boot(){try{const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();renderState(j.state,j.data)}catch{}}
const es=new EventSource('/api/stream');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.state)state=m.state;if(m.type==='state'){renderState(m.state,m.data)}else if(m.type==='ranking'){if(state?.overlays?.ranking?.enabled)renderRanking(m.data)}else if(m.type==='overlay'){const key=m.key,top=m.data;if(!state?.overlays?.[key]?.enabled)return;if(key==='teamEliminated')renderEliminated(top);else if(key.startsWith('team'))renderTeam(top,key);else if(key.startsWith('player'))renderPlayer(top,key)}else if(m.type==='overlay-state'){if(state?.overlays?.[m.key])state.overlays[m.key].enabled=m.enabled;if(m.key==='ranking'&&m.enabled)renderRanking(m.data||state.data);if(!m.enabled&&transientKeys.has(m.key)){if(state?.overlays?.ranking?.enabled)renderRanking(state.data);else $('#empty').style.display='block'}}else if(m.type==='data'){const d=m.data?.derived||m.data;if(d)state.data=d;if(state?.overlays?.ranking?.enabled)renderRanking(state.data)}}catch{}};boot();
</script></body></html>
