<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking da Queda</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img class="bg" src="ranking.png"><div id="rows"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=window.OverlayEngine,root=document.getElementById('root'),rows=document.getElementById('rows');
function logoFor(team){const d=window.OVERLAY_DATA||{};return d.teamLogos?.[team['Team ID']]||d.teamLogos?.[team['Team Name']]||d.defaultLogo}
function render(data){const m=data?.teamData||[];if(!m.length){E.fadeOut(root);return}const h=m[0],rs=m.slice(1).filter(r=>r?.some(Boolean));rows.innerHTML='';rs.forEach((r,i)=>{const el=document.createElement('div');el.className='ranking-row';el.style.left='650px';el.style.top=(182+i*72)+'px';el.style.width='1020px';const rank=r[h.indexOf('Match Rank')]||String(i+1),name=r[h.indexOf('Team Name')]||'TEAM',kills=r[h.indexOf('Kill')]||'0';el.innerHTML=`<div class="rank">${E.esc(rank)}</div><img class="logo" src="${E.esc(logoFor(Object.fromEntries(h.map((x,j)=>[x,r[j]]))))}"><div class="team-name">${E.esc(name)}</div><div class="points">${E.esc(kills)}</div><div class="status"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div>`;rows.appendChild(el)});E.fadeIn(root)}
E.api('/api/state').then(j=>render(j.data));E.stream(msg=>{if(msg.type==='ranking'||msg.type==='data'||msg.type==='state'){if(msg.type==='ranking')render(msg.data);else if(msg.data)render(msg.data)}});setInterval(()=>E.api('/api/state').then(j=>{if(j.data)render(j.data)}).catch(()=>{}),1);
</script></body></html>
