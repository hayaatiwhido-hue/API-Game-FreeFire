<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking da Queda</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img class="bg" src="ranking.png"><div id="rows"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,root=document.getElementById('root'),rows=document.getElementById('rows'),cfg=window.OVERLAY_CONFIG||{};
function logoFor(team){const d=window.OVERLAY_DATA||{};return d.teamLogos?.[team['Team ID']]||d.teamLogos?.[team['Team Name']]||d.defaultLogo}
function render(data){const m=data?.teamData||[];if(!m.length){E.fadeOut(root);return}const h=m[0]||[],p=cfg.positions?.ranking||{};rows.innerHTML='';m.slice(1).filter(r=>r?.some(Boolean)).forEach((r,i)=>{const obj=Object.fromEntries(h.map((x,j)=>[x,r[j]]));const el=document.createElement('div');el.className='ranking-row';el.style.left=(p.x||690)+'px';el.style.top=((p.y||120)+i*(p.rowH||72))+'px';el.style.width=(p.w||980)+'px';el.style.height=(p.rowH||72)+'px';el.style.gridTemplateColumns='90px 130px 1fr 160px 160px';el.innerHTML=`<div class="rank" style="width:${p.rankX?Math.max(1,p.rankX-(p.x||690)-20):90}px">${E.esc(obj['Match Rank']||String(i+1))}</div><img class="logo" src="${E.esc(logoFor(obj))}"><div class="team-name">${E.esc(obj['Team Name']||'TEAM')}</div><div class="points">${E.esc(obj['Kill']||'0')}</div><div class="status"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div>`;rows.appendChild(el)});E.fadeIn(root)}
E.api('/api/state').then(j=>{if(j.state?.overlays?.ranking?.enabled)render(j.data)});E.stream(msg=>{if(msg.type==='ranking'||msg.type==='data'||msg.type==='state'){if(msg.type==='ranking')render(msg.data);else if(msg.data)render(msg.data.data||msg.data)}if(msg.type==='overlay-state'&&msg.key==='ranking'&&!msg.enabled)E.fadeOut(root)});
</script></body></html>
