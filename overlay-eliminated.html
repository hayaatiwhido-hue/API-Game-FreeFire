<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe Eliminada</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img class="bg" src="team-eliminated.png"><img id="logo" class="dyn logo"><div id="name" class="dyn name"></div><div id="rank" class="dyn value"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,key='teamEliminated',root=document.getElementById('root'),cfg=window.OVERLAY_CONFIG||{};function place(el,p,center=true){if(!p)return;el.style.left=(p.x||0)+'px';el.style.top=(p.y||0)+'px';if(p.w)el.style.width=p.w+'px';if(p.h)el.style.height=p.h+'px';if(center)el.style.transform='translate(-50%,-50%)'}place(document.getElementById('logo'),cfg.positions?.eliminated?.logo);place(document.getElementById('name'),cfg.positions?.eliminated?.name);place(document.getElementById('rank'),cfg.positions?.eliminated?.rank);
function render(top){if(!top){E.fadeOut(root);return}const d=window.OVERLAY_DATA||{};document.getElementById('logo').src=d.teamLogos?.[top.teamId]||d.teamLogos?.[top.teamName]||d.defaultLogo;document.getElementById('name').textContent=top.teamName||'TEAM';document.getElementById('rank').textContent='#'+(top.rank||'');E.fadeIn(root);clearTimeout(window.__hide);window.__hide=setTimeout(()=>E.fadeOut(root),cfg.animation?.topDurationMs||6500)}E.api('/api/overlay/'+key).then(j=>{if(j.enabled)render(j.data?.tops?.[key])});E.stream(m=>{if(m.type==='overlay'&&m.key===key)render(m.data);if(m.type==='overlay-state'&&m.key===key&&!m.enabled)E.fadeOut(root)});
</script></body></html>
