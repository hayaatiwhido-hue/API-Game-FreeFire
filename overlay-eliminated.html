<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe Eliminada</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img class="bg" src="team-eliminated.png"><img id="logo" class="dyn logo" style="left:145px;top:390px;width:280px;height:280px"><div id="name" class="dyn name" style="left:980px;top:805px;width:760px;font-size:58px;color:#111"></div><div id="rank" class="dyn value" style="left:775px;top:805px;width:180px;font-size:48px;color:#fff"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,key='teamEliminated',root=document.getElementById('root');function render(top){if(!top){E.fadeOut(root);return}const d=window.OVERLAY_DATA||{};document.getElementById('logo').src=d.teamLogos?.[top.teamName]||d.defaultLogo;document.getElementById('name').textContent=top.teamName||'TEAM';document.getElementById('rank').textContent='#'+(top.rank||'');E.fadeIn(root);clearTimeout(window.__hide);window.__hide=setTimeout(()=>E.fadeOut(root),window.OVERLAY_CONFIG.animation.topDurationMs)}E.api('/api/overlay/'+key).then(j=>{if(j.enabled)render(j.data?.tops?.[key])});E.stream(m=>{if(m.type==='overlay'&&m.key===key)render(m.data);if(m.type==='overlay-state'&&m.key===key&&!m.enabled)E.fadeOut(root)});setInterval(()=>E.api('/api/overlay/'+key).then(j=>{if(j.enabled&&j.data)render(j.data.tops?.[key])}).catch(()=>{}),1);
</script></body></html>
