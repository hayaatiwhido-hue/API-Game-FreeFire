<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Top</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img id="bg" class="bg"><div class="champ" id="champ"></div><img id="photo" class="dyn portrait" style="left:125px;top:365px;width:310px;height:350px"><img id="logo" class="dyn logo" style="left:805px;top:350px;width:310px;height:310px"><div id="name" class="dyn name" style="left:560px;top:690px;width:800px;font-size:52px"></div><div id="team" class="dyn team" style="left:600px;top:760px;width:720px;font-size:30px"></div><div id="value" class="dyn value" style="left:650px;top:845px;width:620px;font-size:54px"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,key=new URLSearchParams(location.search).get('key')||'playerKills',root=document.getElementById('root');document.getElementById('bg').src='../../'+(window.OVERLAY_CONFIG.overlays[key]?.background||'player-kills.png');document.getElementById('champ').textContent=(window.OVERLAY_CONFIG.fields.championship||'').toUpperCase();
function render(top){if(!top){E.fadeOut(root);return}const d=window.OVERLAY_DATA||{};document.getElementById('photo').src=d.playerPhotos?.[top.playerId]||d.playerPhotos?.[top.playerName]||d.defaultPhoto;document.getElementById('logo').src=d.teamLogos?.[top.teamId]||d.teamLogos?.[top.teamName]||d.defaultLogo;document.getElementById('name').textContent=top.playerName||'PLAYER';document.getElementById('team').textContent=top.teamName||'';document.getElementById('value').textContent=top.value||'0';E.fadeIn(root);clearTimeout(window.__hide);window.__hide=setTimeout(()=>E.fadeOut(root),window.OVERLAY_CONFIG.animation.topDurationMs)}
E.api('/api/overlay/'+encodeURIComponent(key)).then(j=>{if(j.enabled)render(j.data?.tops?.[key])});E.stream(m=>{if(m.type==='overlay'&&m.key===key)render(m.data);if(m.type==='overlay-state'&&m.key===key&&!m.enabled)E.fadeOut(root);});setInterval(()=>E.api('/api/overlay/'+encodeURIComponent(key)).then(j=>{if(j.enabled&&j.data)render(j.data.tops?.[key])}).catch(()=>{}),1);
</script></body></html>
