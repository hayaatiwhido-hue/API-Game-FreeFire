<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Top</title><link rel="stylesheet" href="overlay-base.css"></head><body><div id="root" class="overlay"><img id="bg" class="bg"><div class="champ" id="champ"></div><img id="photo" class="dyn portrait"><img id="logo" class="dyn logo"><div id="name" class="dyn name"></div><div id="team" class="dyn team"></div><div id="value" class="dyn value"></div><div id="extra" class="dyn team"></div></div><script src="overlay-config.js"></script><script src="server-config.js"></script><script src="overlay-data.js"></script><script src="overlay-engine.js"></script><script>
const E=OverlayEngine,key=new URLSearchParams(location.search).get('key')||'playerKills',root=document.getElementById('root'),cfg=window.OVERLAY_CONFIG||{};document.getElementById('bg').src=cfg.overlays?.[key]?.background||'player-kills.png';document.getElementById('champ').textContent=(cfg.fields?.championship||'').toUpperCase();
function place(el,p,center=true){if(!p)return;el.style.left=(p.x||0)+'px';el.style.top=(p.y||0)+'px';if(p.w)el.style.width=p.w+'px';if(p.h)el.style.height=p.h+'px';if(center)el.style.transform='translate(-50%,-50%)'}
const pos=cfg.positions?.player||{};place(document.getElementById('logo'),pos.logo);place(document.getElementById('photo'),pos.photo||pos.logo);place(document.getElementById('name'),pos.name);place(document.getElementById('team'),pos.team);place(document.getElementById('value'),pos.value);place(document.getElementById('extra'),cfg.positions?.extraText);
function render(top){if(!top){E.fadeOut(root);return}const d=window.OVERLAY_DATA||{};document.getElementById('photo').src=d.playerPhotos?.[top.playerId]||d.playerPhotos?.[top.playerName]||d.defaultPhoto;document.getElementById('logo').src=d.teamLogos?.[top.teamId]||d.teamLogos?.[top.teamName]||d.defaultLogo;document.getElementById('name').textContent=top.playerName||'PLAYER';document.getElementById('team').textContent=top.teamName||'';document.getElementById('value').textContent=top.value??'0';document.getElementById('extra').textContent=cfg.fields?.extraText||cfg.fields?.sponsor||'';E.fadeIn(root);clearTimeout(window.__hide);window.__hide=setTimeout(()=>E.fadeOut(root),cfg.animation?.topDurationMs||6500)}
E.api('/api/overlay/'+encodeURIComponent(key)).then(j=>{if(j.enabled)render(j.data?.tops?.[key])});E.stream(m=>{if(m.type==='overlay'&&m.key===key)render(m.data);if(m.type==='overlay-state'&&m.key===key&&!m.enabled)E.fadeOut(root)});
</script></body></html>
